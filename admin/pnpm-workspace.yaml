allowBuilds:
  esbuild: true
  unrs-resolver: true

# typescript-eslint can't load TypeScript 7 yet, so tooling that imports
# `typescript` gets the TS 6 API. `pnpm typecheck` still runs TS 7 via the
# `@typescript/native` alias (its `tsc` bin). Remove once typescript-eslint
# supports TS 7: https://github.com/typescript-eslint/typescript-eslint/issues/10940
overrides:
  typescript: "npm:@typescript/typescript6@^6.0.2"
